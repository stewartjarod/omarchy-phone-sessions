name: ci
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check every new commit message
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD"
          fi
          scripts/check-commits.sh "$range"

  test:
    name: Tests against Omarchy ${{ matrix.omarchy_ref }}
    runs-on: ubuntu-latest
    # Omarchy runs on Arch, so lint with Arch's Qt 6 (Ubuntu's is much older and words warnings differently).
    # git must exist before checkout, or it falls back to a tarball without .git.
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        # `default` is upstream's development branch, i.e. what the next Omarchy release will ship:
        # a failure there is early warning that a token was renamed or removed.
        # The release tag is the minimum supported version (keep it equal to OMARCHY_MIN_VERSION).
        omarchy_ref: [default, v4.0.4]
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git nodejs jq qt6-declarative
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch Omarchy ${{ matrix.omarchy_ref }} Commons
        run: |
          commons=$(tests/fetch-commons.sh '${{ matrix.omarchy_ref }}')
          echo "OMARCHY_COMMONS=$commons" >> "$GITHUB_ENV"
      - name: Fetch the marketplace's verification scripts
        run: |
          scripts=$(tests/fetch-marketplace.sh)
          echo "MARKETPLACE_SCRIPTS=$scripts" >> "$GITHUB_ENV"
      - name: Run all checks
        run: REQUIRE_COMMONS=1 REQUIRE_MARKETPLACE=1 tests/run-all.sh

  release-tag:
    name: Tag matches manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [commits, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the manifest version, and the changelog has it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(jq -r .version manifest.json)
          [ "$tag" = "$ver" ] || { echo "tag v$tag != manifest version $ver"; exit 1; }
          grep -q "^## \[$ver\] - " CHANGELOG.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
      - name: Publish a GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(jq -r .version manifest.json)
          awk -v v="$ver" '$0 ~ "^## \\["v"\\]"{f=1; next} /^## \[/{f=0} /^\[[^]]+\]: https:/{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
